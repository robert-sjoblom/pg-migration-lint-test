name: Migration Lint (go-migrate)

on:
  pull_request:
    paths:
      - 'go-migrate-app/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: robert-sjoblom/pg-migration-lint@v2.16.2
        with:
          working-directory: go-migrate-app
          fail-on: major
